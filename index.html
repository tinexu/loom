<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Loom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="logo"></span>Loom</div>
    <button class="tb" id="btn-map" title="History map (⌘/Ctrl+B)">Map</button>
    <div class="spacer"></div>
    <button class="tb" id="btn-newroot" title="New root (⌘/Ctrl+N)">New root</button>
    <div class="zoom">
      <button class="tb icon" id="btn-zoomout" title="Zoom out">−</button>
      <button class="tb" id="zoom-label" title="Reset to 100%">100%</button>
      <button class="tb icon" id="btn-zoomin" title="Zoom in">+</button>
    </div>
    <button class="tb" id="btn-fit" title="Fit everything (⌘/Ctrl+0)">Fit</button>
    <button class="tb" id="btn-settings" title="Settings">Settings</button>
  </header>

  <aside id="sidebar" hidden>
    <div class="side-head">
      <input id="map-search" type="search" placeholder="Search history" spellcheck="false">
    </div>
    <div id="map-tree"></div>
    <div class="side-foot" id="map-stats"></div>
  </aside>

  <main id="viewport">
    <div id="world">
      <svg id="edges" width="1" height="1"></svg>
      <div id="cards"></div>
    </div>
    <div id="empty" hidden>
      <div class="empty-title">A terminal you can see.</div>
      <div class="empty-sub">Every command becomes a card. Branch from any card, pipe one card into another, and ask Claude when you don't remember the flags.</div>
      <div class="empty-chips">
        <button class="chip" data-cmd="ls">ls</button>
        <button class="chip" data-cmd="git log">git log</button>
        <button class="chip" data-cmd="git status">git status</button>
        <button class="chip" data-ask="find the 10 largest files under here">? find the 10 largest files under here</button>
      </div>
    </div>
    <canvas id="minimap" width="220" height="140"></canvas>
  </main>

  <div id="composer">
    <div id="suggestion" hidden></div>
    <div class="bar" id="bar">
      <button id="mode" title="Toggle shell / ask Claude (Tab)">$</button>
      <span id="cwd-chip" title="Working directory of the active card"></span>
      <span id="pipe-chip" hidden></span>
      <input id="prompt" autocomplete="off" spellcheck="false" placeholder="Type a command">
      <span id="hint">Tab · ask Claude</span>
    </div>
  </div>

  <div id="toasts"></div>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Settings</h2>
      <p class="muted" id="settings-note"></p>
      <label>Anthropic API key
        <input id="set-key" type="password" autocomplete="off" spellcheck="false">
      </label>
      <div class="row-actions"><button type="button" class="linkish" id="set-key-remove">Remove saved key</button></div>
      <label>Model
        <input id="set-model" spellcheck="false">
      </label>
      <label class="check"><input type="checkbox" id="set-color"> Force color output
        <span class="muted">Tools print ANSI colors even though Loom runs them on pipes. Can break in-command pipes like <code>git branch | xargs</code>.</span>
      </label>
      <p class="muted small" id="set-shell"></p>
      <div class="dialog-actions">
        <button type="button" class="danger" id="set-clear">Clear canvas</button>
        <div class="spacer"></div>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save" class="primary" id="set-save">Save</button>
      </div>
    </form>
  </dialog>

  <script src="ansi.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
